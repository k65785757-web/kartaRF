<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карты РФ — Навигация по России</title>
    <style>
        /* ============================================================
           ОСНОВНЫЕ СТИЛИ
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --bg-card: #1a1a3a;
            --bg-card-hover: #252550;
            --bg-input: #0a0a1a;
            --text-primary: #e8edf5;
            --text-secondary: #8ba0c7;
            --text-muted: #4a5a7a;
            --border-color: rgba(255,255,255,0.06);
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --radius: 16px;
            --accent: #0088cc;
            --accent-hover: #0066a0;
            --success: #34c759;
            --warning: #fbbf24;
            --gradient: linear-gradient(135deg, #0088cc, #00b4d8, #34c759);
            --radius-sm: 10px;
            --radius-lg: 24px;
        }

        .light-theme {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-card: #e8ecf1;
            --bg-card-hover: #d5dbe3;
            --bg-input: #f0f2f5;
            --text-primary: #1a1a2e;
            --text-secondary: #4a6085;
            --text-muted: #8ba0c7;
            --border-color: rgba(0,0,0,0.08);
            --shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        body {
            font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: all 0.3s ease;
            overflow: hidden;
            height: 100vh;
        }

        /* ============================================================
           ШАПКА
           ============================================================ */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        .header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .header .logo .icon { font-size: 28px; }
        .header .logo span { color: var(--accent); }

        .header .logo .city-badge {
            font-size: 11px;
            background: rgba(0,136,204,0.15);
            color: var(--accent);
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        .header .actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .header .actions button {
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header .actions button:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .header .actions button.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* ============================================================
           ПОИСКОВАЯ СТРОКА
           ============================================================ */
        .search-section {
            padding: 12px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            transition: all 0.3s ease;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-section .search-wrap {
            flex: 1;
            display: flex;
            gap: 10px;
            min-width: 250px;
        }

        .search-section .search-wrap input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s;
            min-width: 150px;
        }
        .search-section .search-wrap input::placeholder { color: var(--text-muted); }
        .search-section .search-wrap input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,136,204,0.15);
        }

        .search-section .search-wrap button {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            white-space: nowrap;
        }
        .search-section .search-wrap button:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
        }

        .search-section .voice-btn {
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
        }
        .search-section .voice-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .search-section .voice-btn.recording {
            border-color: #ef4444;
            color: #ef4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ============================================================
           КАРТА
           ============================================================ */
        .map-container {
            position: relative;
            flex: 1;
            height: calc(100vh - 200px);
            min-height: 400px;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ============================================================
           НИЖНЯЯ ПАНЕЛЬ (рекомендации, навигация)
           ============================================================ */
        .bottom-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 10px 16px 16px 16px;
            z-index: 99;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            max-height: 45vh;
            overflow-y: auto;
        }

        .bottom-panel::-webkit-scrollbar {
            width: 4px;
        }
        .bottom-panel::-webkit-scrollbar-track {
            background: transparent;
        }
        .bottom-panel::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        .bottom-panel .panel-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            overflow-x: auto;
            flex-wrap: nowrap;
            padding-bottom: 4px;
        }

        .bottom-panel .panel-tabs button {
            padding: 6px 16px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s;
            font-family: inherit;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .bottom-panel .panel-tabs button:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }
        .bottom-panel .panel-tabs button.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .bottom-panel .panel-content {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            padding: 4px 0;
        }
        .bottom-panel .panel-content.active {
            display: grid;
        }

        .bottom-panel .panel-content .item {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s;
        }
        .bottom-panel .panel-content .item:hover {
            background: var(--bg-card-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .bottom-panel .panel-content .item .name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .bottom-panel .panel-content .item .address {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .bottom-panel .panel-content .item .meta {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
            display: flex;
            gap: 12px;
        }

        .bottom-panel .panel-content .item .fav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            float: right;
        }
        .bottom-panel .panel-content .item .fav-btn.active {
            color: #fbbf24;
        }
        .bottom-panel .panel-content .item .fav-btn:hover {
            transform: scale(1.2);
        }

        /* ============================================================
           УМНЫЙ АССИСТЕНТ (чат)
           ============================================================ */
        .assistant-modal {
            display: none;
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 340px;
            max-width: 90vw;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            z-index: 200;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }
        .assistant-modal.active {
            display: block;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .assistant-modal .header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-primary);
            position: sticky;
            top: 0;
        }
        .assistant-modal .header .title {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .assistant-modal .header .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 22px;
            cursor: pointer;
        }

        .assistant-modal .messages {
            padding: 12px 16px;
            max-height: 250px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .assistant-modal .messages .msg {
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            max-width: 85%;
            font-size: 14px;
            line-height: 1.5;
        }
        .assistant-modal .messages .msg.bot {
            background: var(--bg-card);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .assistant-modal .messages .msg.user {
            background: var(--accent);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .assistant-modal .input-row {
            padding: 10px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
        }
        .assistant-modal .input-row input {
            flex: 1;
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }
        .assistant-modal .input-row input:focus {
            border-color: var(--accent);
        }
        .assistant-modal .input-row button {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
        }

        /* ============================================================
           КНОПКА АССИСТЕНТА (плавающая)
           ============================================================ */
        .assistant-fab {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--gradient);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 150;
            box-shadow: 0 4px 20px rgba(0,136,204,0.3);
            transition: all 0.3s;
        }
        .assistant-fab:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(0,136,204,0.4);
        }

        /* ============================================================
           НАСТРОЙКИ
           ============================================================ */
        .settings-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 300;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .settings-modal.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .settings-modal .settings-container {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            padding: 24px;
            transition: all 0.3s ease;
        }

        .settings-modal .settings-container .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .settings-modal .settings-container .settings-header h2 {
            font-size: 20px;
            color: var(--text-primary);
        }

        .settings-modal .settings-container .settings-header .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .settings-modal .settings-container .settings-header .close-btn:hover {
            color: var(--text-primary);
            transform: rotate(90deg);
        }

        .settings-group { margin-bottom: 20px; }

        .settings-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .settings-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s;
        }
        .settings-group select:focus { border-color: var(--accent); }
        .settings-group select option { background: var(--bg-secondary); color: var(--text-primary); }

        .settings-group .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .settings-group .toggle-row .toggle-label { font-size: 14px; color: var(--text-primary); }
        .settings-group .toggle-row .toggle-desc { font-size: 12px; color: var(--text-muted); }

        .toggle {
            position: relative;
            width: 48px;
            height: 28px;
            flex-shrink: 0;
            cursor: pointer;
        }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle .slider {
            position: absolute;
            inset: 0;
            background: var(--bg-card);
            border-radius: 14px;
            transition: all 0.3s;
            border: 1px solid var(--border-color);
        }
        .toggle .slider::before {
            content: '';
            position: absolute;
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background: var(--text-secondary);
            border-radius: 50%;
            transition: all 0.3s;
        }
        .toggle input:checked + .slider {
            background: var(--accent);
            border-color: var(--accent);
        }
        .toggle input:checked + .slider::before {
            transform: translateX(20px);
            background: white;
        }

        .settings-group .save-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--accent);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .settings-group .save-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.01);
        }

        /* ============================================================
           АДАПТИВНОСТЬ
           ============================================================ */
        @media (max-width: 768px) {
            .header { padding: 10px 16px; flex-direction: column; align-items: stretch; }
            .header .logo { font-size: 17px; justify-content: center; }
            .header .actions { justify-content: center; }
            .header .actions button { font-size: 12px; padding: 6px 12px; }

            .search-section { padding: 10px 16px; flex-direction: column; }
            .search-section .search-wrap { min-width: 0; width: 100%; }
            .search-section .search-wrap input { min-width: 0; font-size: 14px; }

            .map-container { height: calc(100vh - 260px); min-height: 300px; }

            .bottom-panel { padding: 8px 12px 12px 12px; max-height: 40vh; }
            .bottom-panel .panel-content { grid-template-columns: 1fr 1fr; }

            .assistant-modal { width: 300px; bottom: 70px; right: 10px; }
            .assistant-fab { bottom: 80px; right: 10px; width: 48px; height: 48px; font-size: 20px; }

            .settings-modal .settings-container { padding: 16px; margin: 10px; }
        }

        @media (max-width: 480px) {
            .bottom-panel .panel-content { grid-template-columns: 1fr; }
            .header .logo .city-badge { font-size: 10px; padding: 1px 8px; }
            .assistant-modal { width: 280px; }
        }

        /* ============================================================
           УВЕДОМЛЕНИЕ
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            z-index: 400;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ============================================================
           СТАТУС ПОИСКА
           ============================================================ */
        .search-status {
            padding: 8px 16px;
            font-size: 13px;
            color: var(--text-secondary);
            display: none;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }
        .search-status.show {
            display: block;
        }
        .search-status .highlight {
            color: var(--accent);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- ============================================================
    ШАПКА
    ============================================================ -->
    <header class="header">
        <div class="logo">
            <span class="icon">🗺️</span>
            Карты<span>РФ</span>
            <span class="city-badge" id="cityBadge">📍 Дзержинск</span>
        </div>
        <div class="actions">
            <button id="assistantBtn" title="Умный ассистент">🤖</button>
            <button id="favoritesBtn" title="Избранное">⭐</button>
            <button id="settingsBtn">⚙️</button>
        </div>
    </header>

    <!-- ============================================================
    ПОИСК
    ============================================================ -->
    <div class="search-section">
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="🔍 Поиск мест, адресов, улиц..." value="Дзержинск">
            <button id="searchBtn">Найти</button>
        </div>
        <button class="voice-btn" id="voiceBtn" title="Голосовой поиск">🎤</button>
        <button id="currentLocationBtn" style="padding:10px 16px;border:1px solid var(--border-color);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text-secondary);cursor:pointer;font-family:inherit;font-size:13px;display:flex;align-items:center;gap:6px;">📍 Моё местоположение</button>
    </div>

    <!-- Статус поиска -->
    <div class="search-status" id="searchStatus">
        🔍 Найдено <span class="highlight" id="searchCount">0</span> результатов
    </div>

    <!-- ============================================================
    КАРТА
    ============================================================ -->
    <div class="map-container">
        <iframe id="mapFrame" 
                src="https://yandex.ru/map-widget/v1/?ll=43.4625%2C56.2389&z=14&l=map"
                allowfullscreen>
        </iframe>
    </div>

    <!-- ============================================================
    НИЖНЯЯ ПАНЕЛЬ
    ============================================================ -->
    <div class="bottom-panel" id="bottomPanel">
        <div class="panel-tabs">
            <button class="active" data-tab="recommendations">⭐ Рекомендации</button>
            <button data-tab="nearby">📍 Рядом</button>
            <button data-tab="favorites">❤️ Избранное</button>
            <button data-tab="history">🕐 История</button>
            <button data-tab="search">🔍 Результаты поиска</button>
        </div>

        <div class="panel-content active" id="tab-recommendations">
            <!-- Загружается через JS -->
        </div>
        <div class="panel-content" id="tab-nearby">
            <!-- Загружается через JS -->
        </div>
        <div class="panel-content" id="tab-favorites">
            <!-- Загружается через JS -->
        </div>
        <div class="panel-content" id="tab-history">
            <!-- Загружается через JS -->
        </div>
        <div class="panel-content" id="tab-search">
            <!-- Загружается через JS -->
        </div>
    </div>

    <!-- ============================================================
    УМНЫЙ АССИСТЕНТ
    ============================================================ -->
    <button class="assistant-fab" id="assistantFab">🤖</button>

    <div class="assistant-modal" id="assistantModal">
        <div class="header">
            <div class="title">🤖 Умный ассистент</div>
            <button class="close-btn" id="assistantClose">✕</button>

        // ============================================================
        // 4. РЕНДЕР МЕСТ
        // ============================================================
        function renderPlaces(container, placesList, showFavBtn = true) {
            if (!placesList || placesList.length === 0) {
                container.innerHTML = `
                    <div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--text-muted);">
                        <p>😕 Ничего не найдено</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = placesList.map(p => `
                <div class="item" onclick="focusPlace(${p.lat}, ${p.lng}, '${p.name.replace(/'/g, "\\'")}')">
                    ${showFavBtn ? `
                        <button class="fav-btn ${state.favorites.includes(p.id) ? 'active' : ''}" 
                                onclick="event.stopPropagation(); toggleFavorite(${p.id})">
                            ${state.favorites.includes(p.id) ? '⭐' : '☆'}
                        </button>
                    ` : ''}
                    <div class="name">${p.name}</div>
                    <div class="address">📍 ${p.address}</div>
                    <div class="meta">
                        <span>⭐ ${p.rating || '—'}</span>
                        <span>${p.category || ''}</span>
                        ${p.metro ? `<span>🚇 ${p.metro}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // ============================================================
        // 5. ОБНОВЛЕНИЕ КАРТЫ
        // ============================================================
        function updateMap(lat = 56.2389, lng = 43.4625, zoom = 14) {
            const traffic = state.showTraffic ? '&l=map,trf' : '&l=map';
            // Добавляем маркеры для всех мест
            let markers = '';
            places.forEach(p => {
                markers += `~${p.lng}%2C${p.lat}%2Cpm2rdl`;
            });
            const markerParam = markers ? `&pt=${markers.slice(1)}` : '';
            mapFrame.src = `https://yandex.ru/map-widget/v1/?ll=${lng}%2C${lat}&z=${zoom}${traffic}${markerParam}`;
        }

        // ============================================================
        // 6. ФОКУС НА МЕСТЕ
        // ============================================================
        function focusPlace(lat, lng, name) {
            updateMap(lat, lng, 17);
            // Добавляем выделение маркера
            setTimeout(() => {
                mapFrame.src += `~${lng}%2C${lat}%2Cflag`;
            }, 300);
            showToast(`📍 ${name}`);
            // Добавляем в историю
            const place = places.find(p => p.lat === lat && p.lng === lng);
            if (place && !state.history.includes(place.id)) {
                state.history.unshift(place.id);
                if (state.history.length > 50) state.history.pop();
                localStorage.setItem('mapRF_history', JSON.stringify(state.history));
                renderTab('history');
            }
        }

        // ============================================================
        // 7. ИЗБРАННОЕ
        // ============================================================
        function toggleFavorite(id) {
            const index = state.favorites.indexOf(id);
            if (index > -1) {
                state.favorites.splice(index, 1);
                showToast('❌ Удалено из избранного');
            } else {
                state.favorites.push(id);
                showToast('⭐ Добавлено в избранное');
            }
            localStorage.setItem('mapRF_favorites', JSON.stringify(state.favorites));
            renderTab('favorites');
            // Обновляем текущую вкладку
            const activeTab = document.querySelector('.panel-tabs .active');
            if (activeTab) renderTab(activeTab.dataset.tab);
        }

        // ============================================================
        // 8. РЕНДЕР ВКЛАДОК
        // ============================================================
        function renderTab(tabName) {
            const container = tabContents[tabName];
            if (!container) return;

            switch (tabName) {
                case 'recommendations':
                    const recs = [...places].sort((a, b) => (b.rating || 0) - (a.rating || 0)).slice(0, 8);
                    renderPlaces(container, recs);
                    break;
                case 'nearby':
                    // Сортируем по расстоянию от текущей позиции
                    const near = [...places].map(p => {
                        const dist = getDistance(state.currentPosition.lat, state.currentPosition.lng, p.lat, p.lng);
                        return { ...p, distance: dist };
                    }).sort((a, b) => a.distance - b.distance).slice(0, 8);
                    renderPlaces(container, near);
                    break;
                case 'favorites':
                    const favs = places.filter(p => state.favorites.includes(p.id));
                    renderPlaces(container, favs);
                    break;
                case 'history':
                    const hist = places.filter(p => state.history.includes(p.id)).slice(0, 8);
                    renderPlaces(container, hist);
                    break;
                case 'search':
                    renderPlaces(container, state.searchResults);
                    break;
            }
        }

        // ============================================================
        // 9. ОПРЕДЕЛЕНИЕ МЕСТОПОЛОЖЕНИЯ
        // ============================================================
        function getLocation() {
            if (navigator.geolocation) {
                showToast('📍 Определение местоположения...');
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        state.currentPosition = { lat, lng };
                        updateMap(lat, lng, 15);
                        showToast('📍 Местоположение определено');
                        renderTab('nearby');
                    },
                    () => {
                        showToast('⚠️ Не удалось определить местоположение');
                    }, {
                        enableHighAccuracy: true,
                        timeout: 10000,
                    }
                );
            } else {
                showToast('⚠️ Ваш браузер не поддерживает геолокацию');
            }
        }

        // ============================================================
        // 10. РАСЧЁТ РАССТОЯНИЯ
        // ============================================================
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // ============================================================
        // 11. УМНЫЙ АССИСТЕНТ
        // ============================================================
        function toggleAssistant() {
            state.assistantOpen = !state.assistantOpen;
            assistantModal.classList.toggle('active', state.assistantOpen);
        }

        function sendAssistantMessage() {
            const text = assistantInput.value.trim();
            if (!text) return;

            // Добавляем сообщение пользователя
            const userMsg = document.createElement('div');
            userMsg.className = 'msg user';
            userMsg.textContent = text;
            assistantMessages.appendChild(userMsg);

            assistantInput.value = '';
            assistantMessages.scrollTop = assistantMessages.scrollHeight;

            // Генерируем ответ (поиск по ключевым словам)
            setTimeout(() => {
                const botMsg = document.createElement('div');
                botMsg.className = 'msg bot';
                botMsg.textContent = getAssistantResponse(text);
                assistantMessages.appendChild(botMsg);
                assistantMessages.scrollTop = assistantMessages.scrollHeight;
            }, 500);
        }

        function getAssistantResponse(query) {
            const lower = query.toLowerCase();
            // Поиск по ключевым словам
            if (lower.includes('кафе') || lower.includes('ресторан') || lower.includes('есть')) {
                const places = getPlacesByCategory('Еда');
                return places.length > 0 ?
                    `🍽️ Нашёл кафе и рестораны: ${places.slice(0,3).map(p => p.name).join(', ')}. Хотите узнать подробнее?` :
                    '🍽️ В Дзержинске есть кафе "Встреча" и "Библиотека". Хотите адрес?';
            }
            if (lower.includes('парк') || lower.includes('гулять') || lower.includes('природа')) {
                const places = getPlacesByCategory('Парки');
                return places.length > 0 ?
                    `🌳 Отличные места для прогулок: ${places.slice(0,3).map(p => p.name).join(', ')}.` :
                    '🌳 В Дзержинске есть Парк культуры и Парк Свердлова. Хотите адрес?';
            }
            if (lower.includes('торговый') || lower.includes('магазин') || lower.includes('шопинг') || lower.includes('купить')) {
                const places = getPlacesByCategory('Торговля');
                return places.length > 0 ?
                    `🛍️ Торговые центры: ${places.slice(0,3).map(p => p.name).join(', ')}.` :
                    '🛍️ В Дзержинске есть ТЦ "Россия" и "Окский". Хотите адрес?';
            }
            if (lower.includes('музей') || lower.includes('история') || lower.includes('культура')) {
                const places = getPlacesByCategory('Культура');
                return places.length > 0 ?
                    `🏛️ Музеи и культурные места: ${places.slice(0,3).map(p => p.name).join(', ')}.` :
                    '🏛️ В Дзержинске есть Краеведческий музей. Хотите узнать больше?';
            }
            if (lower.includes('транспорт') || lower.includes('вокзал') || lower.includes('аэропорт')) {
                const places = getPlacesByCategory('Транспорт');
                return places.length > 0 ?
                    `🚉 Транспортные узлы: ${places.slice(0,3).map(p => p.name).join(', ')}.` :
                    '🚉 В Дзержинске есть ЖД вокзал. Хотите адрес?';
            }
            if (lower.includes('спорт') || lower.includes('стадион') || lower.includes('футбол')) {
                const places = getPlacesByCategory('Спорт');
                return places.length > 0 ?
                    `⚽ Спортивные объекты: ${places.slice(0,3).map(p => p.name).join(', ')}.` :
                    '⚽ В Дзержинске есть стадион "Химик". Хотите адрес?';
            }
            if (lower.includes('привет') || lower.includes('здравствуй') || lower.includes('добрый')) {
                return '👋 Здравствуйте! Чем могу помочь? Я знаю все места в Дзержинске!';
            }
            if (lower.includes('погода') || lower.includes('дождь') || lower.includes('солнце')) {
                return '🌤️ Погода в Дзержинске сегодня хорошая! Не забудьте проверить прогноз перед выходом.';
            }
            if (lower.includes('как дела') || lower.includes('как ты')) {
                return '🤖 Всё отлично! Готов помочь вам найти места в Дзержинске. Что ищем?';
            }

            // Общий поиск по названиям
            const found = places.filter(p =>
                p.name.toLowerCase().includes(lower) ||
                p.address.toLowerCase().includes(lower) ||
                p.street.toLowerCase().includes(lower) ||
                p.tags.some(t => t.toLowerCase().includes(lower))
            );
            if (found.length > 0) {
                return `🔍 Нашёл похожие места: ${found.slice(0,3).map(p => p.name).join(', ')}. Нажмите на них на карте для подробностей.`;
            }

            return '🤔 Не нашёл подходящих мест по вашему запросу. Попробуйте спросить про кафе, парки, магазины или музеи!';
        }

        function getPlacesByCategory(category) {
            return places.filter(p => p.category === category || p.type === category);
        }

        // ============================================================
        // 12. ПОИСК (УЛУЧШЕННЫЙ)
        // ============================================================
        function performSearch(query) {
            if (!query || query.trim() === '') {
                showToast('🔍 Введите запрос для поиска');
                return;
            }
            const lower = query.trim().toLowerCase();
            
            // Расширенный поиск: по названию, адресу, улице, тегам, категории, типу
            const results = places.filter(p => {
                // Поиск по названию
                if (p.name.toLowerCase().includes(lower)) return true;
                // Поиск по адресу
                if (p.address.toLowerCase().includes(lower)) return true;
                // Поиск по улице (новое поле)
                if (p.street && p.street.toLowerCase().includes(lower)) return true;
                // Поиск по тегам
                if (p.tags.some(t => t.toLowerCase().includes(lower))) return true;
                // Поиск по категории
                if (p.category && p.category.toLowerCase().includes(lower)) return true;
                // Поиск по типу
                if (p.type && p.type.toLowerCase().includes(lower)) return true;
                // Поиск по описанию
                if (p.description && p.description.toLowerCase().includes(lower)) return true;
                return false;
            });

            // Сохраняем результаты
            state.searchResults = results;

            // Показываем статус поиска
            searchStatus.classList.add('show');
            searchCount.textContent = results.length;

            if (results.length === 0) {
                showToast('😕 Ничего не найдено по запросу: "' + query + '"');
                // Показываем пустую вкладку
                const container = tabContents.search;
                renderPlaces(container, []);
                // Активируем вкладку поиска
                activateTab('search');
                return;
            }

            // Показываем результаты на карте (центрируем на первом результате)
            const first = results[0];
            updateMap(first.lat, first.lng, 15);

            // Показываем в нижней панели (вкладка поиска)
            const container = tabContents.search;
            renderPlaces(container, results);

            // Активируем вкладку поиска
            activateTab('search');

            showToast(`🔍 Найдено: ${results.length} мест по запросу "${query}"`);
        }

        function activateTab(tabName) {
            tabButtons.forEach(b => {
                b.classList.toggle('active', b.dataset.tab === tabName);
            });
            Object.values(tabContents).forEach(c => c.classList.remove('active'));
            if (tabContents[tabName]) {
                tabContents[tabName].classList.add('active');
            }
            state.currentTab = tabName;
        }

        // ============================================================
        // 13. TOAST
        // ============================================================
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ============================================================
        // 14. НАСТРОЙКИ
        // ============================================================
        function openSettings() {
            settingsModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeSettings() {
            settingsModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        settingsBtn.addEventListener('click', openSettings);
        settingsClose.addEventListener('click', closeSettings);
        settingsModal.addEventListener('click', function(e) {
            if (e.target === this) closeSettings();
        });

        // ============================================================
        // 15. ТЕМА
        // ============================================================
        function toggleTheme(isDark) {
            state.theme = isDark ? 'dark' : 'light';
            document.body.classList.toggle('light-theme', !isDark);
            themeToggleCheck.checked = isDark;
            localStorage.setItem('mapRF-theme', state.theme);
        }

        themeToggleCheck.addEventListener('change', function() {
            toggleTheme(this.checked);
        });

        // ============================================================
        // 16. ЗАГРУЗКА НАСТРОЕК
        // ============================================================
        function loadSettings() {
            const savedTheme = localStorage.getItem('mapRF-theme');
            if (savedTheme) {
                state.theme = savedTheme;
                const isDark = savedTheme === 'dark';
                document.body.classList.toggle('light-theme', !isDark);
                themeToggleCheck.checked = isDark;
            }

            const savedLang = localStorage.getItem('mapRF-lang');
            if (savedLang) {
                state.language = savedLang;
                langSelect.value = savedLang;
            }

            const savedRegion = localStorage.getItem('mapRF-region');
            if (savedRegion) {
                state.region = savedRegion;
                regionSelect.value = savedRegion;
                const names = {
                    dzerzhinsk: '📍 Дзержинск',
                    nnovgorod: '📍 Нижний Новгород',
                    moscow: '📍 Москва',
                    spb: '📍 Санкт-Петербург',
                    kazan: '📍 Казань',
                    ekb: '📍 Екатеринбург',
                    novosibirsk: '📍 Новосибирск',
                    vladivostok: '📍 Владивосток',
                };
                cityBadge.textContent = names[savedRegion] || '📍 Дзержинск';
            }

            const savedTraffic = localStorage.getItem('mapRF-traffic');
            if (savedTraffic !== null) {
                state.showTraffic = savedTraffic === 'true';
                trafficCheck.checked = state.showTraffic;
            }

            // Загружаем избранное из localStorage
            const savedFavorites = localStorage.getItem('mapRF_favorites');
            if (savedFavorites) {
                state.favorites = JSON.parse(savedFavorites);
            }

            const savedHistory = localStorage.getItem('mapRF_history');
            if (savedHistory) {
                state.history = JSON.parse(savedHistory);
            }
        }

        // ============================================================
        // 17. СОХРАНЕНИЕ НАСТРОЕК
        // ============================================================
        settingsSave.addEventListener('click', function() {
            state.language = langSelect.value;
            state.region = regionSelect.value;
            state.showTraffic = trafficCheck.checked;

            localStorage.setItem('mapRF-lang', state.language);
            localStorage.setItem('mapRF-region', state.region);
            localStorage.setItem('mapRF-traffic', String(state.showTraffic));

            const names = {
                dzerzhinsk: '📍 Дзержинск',
                nnovgorod: '📍 Нижний Новгород',
                moscow: '📍 Москва',
                spb: '📍 Санкт-Петербург',
                kazan: '📍 Казань',
                ekb: '📍 Екатеринбург',
                novosibirsk: '📍 Новосибирск',
                vladivostok: '📍 Владивосток',
            };
            cityBadge.textContent = names[state.region] || '📍 Дзержинск';

            // Обновляем карту
            const coords = {
                dzerzhinsk: { lat: 56.2389, lng: 43.4625 },
                nnovgorod: { lat: 56.3287, lng: 43.9965 },
                moscow: { lat: 55.7558, lng: 37.6176 },
                spb: { lat: 59.9343, lng: 30.3351 },
                kazan: { lat: 55.7887, lng: 49.1221 },
                ekb: { lat: 56.8389, lng: 60.6057 },
                novosibirsk: { lat: 55.0084, lng: 82.9357 },
                vladivostok: { lat: 43.1155, lng: 131.8855 },
            };
            const pos = coords[state.region] || coords.dzerzhinsk;
            state.currentPosition = pos;
            updateMap(pos.lat, pos.lng, 14);

            closeSettings();
            showToast('✅ Настройки сохранены!');
        });

        // ============================================================
        // 18. ОБРАБОТЧИКИ СОБЫТИЙ
        // ============================================================

        // Поиск
        searchBtn.addEventListener('click', function() {
            performSearch(searchInput.value);
        });

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                searchBtn.click();
            }
        });

        // Голосовой ввод
        voiceBtn.addEventListener('click', function() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                showToast('⚠️ Голосовой ввод не поддерживается в этом браузере');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.continuous = false;
            recognition.interimResults = false;

            if (this.classList.contains('recording')) {
                recognition.abort();
                this.classList.remove('recording');
                this.textContent = '🎤';
                return;
            }

            this.classList.add('recording');
            this.textContent = '⏹️';

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                searchInput.value = transcript;
                performSearch(transcript);
                voiceBtn.classList.remove('recording');
                voiceBtn.textContent = '🎤';
            };
            recognition.onerror = function() {
                voiceBtn.classList.remove('recording');
                voiceBtn.textContent = '🎤';
                showToast('⚠️ Не удалось распознать речь');
            };
            recognition.start();
        });

        // Текущее местоположение
        currentLocationBtn.addEventListener('click', getLocation);

        // Вкладки
        tabButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                const tab = this.dataset.tab;
                // Скрываем статус поиска при переключении не на вкладку поиска
                if (tab !== 'search') {
                    searchStatus.classList.remove('show');
                }
                tabButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                Object.values(tabContents).forEach(c => c.classList.remove('active'));
                if (tabContents[tab]) {
                    tabContents[tab].classList.add('active');
                }
                renderTab(tab);
                state.currentTab = tab;
            });
        });

        // Избранное (кнопка в шапке)
        favoritesBtn.addEventListener('click', function() {
            const tabBtn = document.querySelector('[data-tab="favorites"]');
            tabBtn.click();
        });

        // Умный ассистент
        assistantFab.addEventListener('click', toggleAssistant);
        assistantClose.addEventListener('click', toggleAssistant);
        assistantSend.addEventListener('click', sendAssistantMessage);
        assistantInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                sendAssistantMessage();
            }
        });

        // ============================================================
        // 19. ЗАПУСК
        // ============================================================
        loadSettings();

        // Инициализация карты с маркерами
        setTimeout(() => {
            const coords = {
                dzerzhinsk: { lat: 56.2389, lng: 43.4625 },
                nnovgorod: { lat: 56.3287, lng: 43.9965 },
                moscow: { lat: 55.7558, lng: 37.6176 },
                spb: { lat: 59.9343, lng: 30.3351 },
                kazan: { lat: 55.7887, lng: 49.1221 },
                ekb: { lat: 56.8389, lng: 60.6057 },
                novosibirsk: { lat: 55.0084, lng: 82.9357 },
                vladivostok: { lat: 43.1155, lng: 131.8855 },
            };
            const pos = coords[state.region] || coords.dzerzhinsk;
            state.currentPosition = pos;
            updateMap(pos.lat, pos.lng, 14);
        }, 300);

        // Рендерим вкладки
        renderTab('recommendations');
        renderTab('nearby');
        renderTab('favorites');
        renderTab('history');

        // Инициализируем пустую вкладку поиска
        renderPlaces(tabContents.search, []);

        console.log('🗺️ Карты РФ загружены!');
        console.log(`📍 ${places.length} мест в базе`);
        console.log('⭐ Избранное:', state.favorites);
        console.log('🕐 История:', state.history);
        console.log('🤖 Нажмите кнопку с роботом для помощи');
        console.log('🔍 Поиск работает по: названию, адресу, улице, тегам, категории, типу');
    </script>

</body>
